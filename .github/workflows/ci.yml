name: Verify seat relay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm demo:local
      - run: pnpm verify:events
      - run: pnpm build
      - run: node scripts/check-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-and-local-evidence
          path: dist/
          if-no-files-found: error
